<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oleh Riabchenko // В процесі розробки</title>
  <meta name="description" content="Сайт Олега Рябченка зараз оновлюється. Скоро повернемось.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Outfit', sans-serif;
      background: #0a0a0f;
      color: #e8e8f0;
      overflow: hidden;
    }

    /* Animated starfield background */
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(92, 92, 147, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(120, 80, 180, 0.1) 0%, transparent 50%),
        #0a0a0f;
    }

    .noise {
      position: fixed;
      inset: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
      pointer-events: none;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(150, 130, 220, 0.6);
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Center stage */
    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      text-align: center;
    }

    /* Glowing ring */
    .ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 1px solid rgba(150, 130, 220, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      position: relative;
      animation: pulse-ring 3s ease-in-out infinite;
    }

    .ring::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(150, 130, 220, 0.2);
      animation: pulse-ring 3s ease-in-out infinite 0.5s;
    }

    .ring::after {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 1px solid rgba(150, 130, 220, 0.1);
      animation: pulse-ring 3s ease-in-out infinite 1s;
    }

    @keyframes pulse-ring {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .ring-icon {
      font-size: 2.4rem;
      animation: spin-slow 12s linear infinite;
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Label above title */
    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(150, 130, 220, 0.8);
      font-weight: 700;
      margin-bottom: 16px;
      animation: fadeUp 0.8s ease both 0.2s;
    }

    /* Main heading */
    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 200;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #e8e8f0;
      line-height: 1.1;
      margin-bottom: 8px;
      animation: fadeUp 0.8s ease both 0.4s;
    }

    /* Subtitle */
    .subtitle {
      font-size: clamp(0.8rem, 2vw, 1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(150, 130, 220, 0.7);
      font-weight: 700;
      margin-bottom: 40px;
      animation: fadeUp 0.8s ease both 0.5s;
    }

    /* Divider */
    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(150, 130, 220, 0.6), transparent);
      margin: 0 auto 40px;
      animation: fadeUp 0.8s ease both 0.6s;
    }

    /* Status message */
    .status-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(150, 130, 220, 0.15);
      border-radius: 16px;
      padding: 28px 40px;
      max-width: 480px;
      width: 100%;
      animation: fadeUp 0.8s ease both 0.7s;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(150, 130, 220, 0.9);
      font-weight: 700;
      margin-bottom: 14px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(150, 130, 220, 1);
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .status-text {
      font-size: 0.95rem;
      color: rgba(220, 220, 235, 0.65);
      line-height: 1.7;
      font-weight: 200;
    }

    /* Footer signature */
    .signature {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: rgba(150, 130, 220, 0.3);
      text-transform: uppercase;
      animation: fadeUp 1s ease both 1s;
      white-space: nowrap;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="noise"></div>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <main class="stage">
    <div class="ring">
      <span class="ring-icon">⟳</span>
    </div>

    <div class="eyebrow">Oleh Riabchenko</div>
    <h1>3D Virtual Gallery</h1>
    <p class="subtitle">Photography Exhibition</p>

    <div class="divider"></div>

    <div class="status-card">
      <div class="status-indicator">
        <span class="dot"></span>
        В процесі розробки
      </div>
      <p class="status-text">
        Сайт зараз оновлюється та готується до перезапуску.<br>
        Незабаром ми повернемось із новим досвідом.
      </p>
    </div>
  </main>

  <div class="signature">© 2026 Oleh Riabchenko — Скоро повернемось</div>

  <script>
    // Generate floating particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1;
      p.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${Math.random() * 100}%;
        animation-duration: ${Math.random() * 12 + 10}s;
        animation-delay: ${Math.random() * 15}s;
        opacity: ${Math.random() * 0.5 + 0.2};
      `;
      container.appendChild(p);
    }
  </script>

</body>
</html>
