  <script>

    var T = {
      en: {
        navAbout:   'About',
        navPhoto:   'New Photography',
        navApril:   'April',
        aboutName:  'Oleh Riabchenko',
        aboutBody: [
          'I am a photographer and visual artist. I am originally from Kharkiv, but now I live and work in Ivano-Frankivsk. I am currently studying audio-visual arts and photography at the Kharkiv State Academy of Culture. Parallel to my studies, I work as a documentary photographer at the local branch of the National Union of Artists of Ukraine, where I photograph exhibition openings and cultural events.',
          'My personal artistic practice is built around the deconstruction of traditional photography. I work primarily with long exposures, camera movement, and deep digital intervention, testing the physical and digital limits of the medium. My background in music production directly influences my visual approach. By rejecting standard optical rules, I focus my work on pure emotions, the passage of time, and the mechanics of image creation itself.'
        ],
        photoHeading: 'New Photography',
        photoIntro: [
          'This series of images is a visual archive of my search for a photographic language: deconstructing traditional photography, seeking new impressions from the shooting process, and processing the resulting material.',
          'The project is based on rejecting standard shooting rules, embracing moderate randomness, impressions, and completely immersing myself in my feelings. It prompts reflection on time, the self, power, music, and enjoying the moment.',
          'At the end of 2023, while I was in Kharkiv, I stood on the balcony of my apartment and painted with light. Using a long exposure, I captured the headlights of cars, street lamps, and the light from the apartments in the building across the street. I was amazed by the result. It felt as if I had discovered a new kind of photography for myself. After that, I photographed everything that caught my eye in this manner. Camera movements played an important role in shaping the image.',
          'In 2025, after moving to Ivano-Frankivsk, I renewed my interest in this new photography. At first, I put the camera on a tripod and moved it horizontally, trying to create a temporal panorama of the landscape. After that, I took the camera off the tripod and shot entirely handheld. The long exposure was achieved using an ND filter and a stopped-down aperture. The exposure was set using several methods: aperture priority, manual mode, and BULB mode. The latter added more of my personal presence to the photograph.',

    // ─────────────────────────────────────────
    // Language
    // ─────────────────────────────────────────
    function setLang(l) {
      lang = l;
      var c = T[l];

      document.documentElement.lang = l === 'uk' ? 'uk' : 'en';

      document.getElementById('nav-about').textContent  = c.navAbout;
      document.getElementById('nav-photo').textContent  = c.navPhoto;
      document.getElementById('nav-april').textContent  = c.navApril;

      document.getElementById('m-nav-april').textContent = c.navApril;

      document.getElementById('about-body').innerHTML =
        c.aboutBody.map(function(p) { return '<p>' + p + '</p>'; }).join('');

      document.getElementById('april-scroll-hint').textContent = c.aprilScrollHint;

      closeMenu();

    // ─────────────────────────────────────────
    // Page switching
    // ─────────────────────────────────────────
    function showPage(id) {
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
      document.querySelectorAll('.nav-link').forEach(function(l) { l.classList.remove('active'); });
      document.querySelectorAll('.m-link').forEach(function(l) { l.classList.remove('active'); });

      document.getElementById('page-' + id).classList.add('active');
      document.getElementById('nav-' + id).classList.add('active');
      document.getElementById('m-nav-' + id).classList.add('active');

      window.scrollTo({ top: 0, behavior: 'instant' });
      closeMenu();
    }

    // ─────────────────────────────────────────
    // Mobile menu
    // ─────────────────────────────────────────
    function toggleMenu() {
      var menu = document.getElementById('mobile-menu');
      var btn  = document.getElementById('hamburger');
      var isOpen = menu.classList.contains('open');
      menu.classList.toggle('open', !isOpen);
      btn.classList.toggle('open', !isOpen);
    }

    function closeMenu() {
      document.getElementById('mobile-menu').classList.remove('open');
      document.getElementById('hamburger').classList.remove('open');
    }

    // ─────────────────────────────────────────
    // Lightbox
    // ─────────────────────────────────────────
    function openLb(index, photos, basePath) {
      lbPhotos   = photos;
      lbBasePath = basePath;
      lbIndex    = index;
      updateLb();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function updateLb() {
      var img = document.getElementById('lb-img');
      img.src = lbBasePath + lbPhotos[lbIndex];
      img.alt = 'Oleh Riabchenko — photograph ' + (lbIndex + 1);
      document.getElementById('lb-counter').textContent =
        (lbIndex + 1) + ' / ' + lbPhotos.length;
    }

    function lbNav(dir) {
      lbIndex = (lbIndex + dir + lbPhotos.length) % lbPhotos.length;
      updateLb();
    }

    function closeLb() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function lbBgClick(e) {
      if (e.target === document.getElementById('lightbox')) closeLb();
    }

    document.addEventListener('keydown', function(e) {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape')      closeLb();
      if (e.key === 'ArrowLeft')   lbNav(-1);
      if (e.key === 'ArrowRight')  lbNav(1);
    });

    // ─────────────────────────────────────────
    // Natural numeric sort (for New Photography filenames)
    // ─────────────────────────────────────────
    function photoKey(f) {
      return f.replace(/\.jpg$/i, '').split('.').map(Number);
    }

    function comparePhotos(a, b) {
      var ak = photoKey(a), bk = photoKey(b);
      for (var i = 0; i < Math.max(ak.length, bk.length); i++) {
        var d = (ak[i] !== undefined ? ak[i] : -1) - (bk[i] !== undefined ? bk[i] : -1);
        if (d !== 0) return d;
      }
      return 0;
    }

    PHOTOS.sort(comparePhotos);

    // ─────────────────────────────────────────
    // Build New Photography grid
    // ─────────────────────────────────────────
    function buildGrid() {
      var grid = document.getElementById('photo-grid');
      PHOTOS.forEach(function(file, i) {
        var wrap = document.createElement('div');
        wrap.className = 'grid-item';

        var img = document.createElement('img');
        img.src = 'photos_web/' + file;
        var baseName = file.replace(/\.[^.]+$/, '');
        img.alt = 'Oleh Riabchenko — New Photography, photo ' + baseName + ' — long exposure experimental art';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onerror = function() { wrap.style.display = 'none'; };

        wrap.addEventListener('click', (function(idx) {
          return function() { openLb(idx, PHOTOS, 'photos_web/'); };
        })(i));

        wrap.appendChild(img);
        grid.appendChild(wrap);
      });
    }

    // ─────────────────────────────────────────
    // Build April grid (hero = index 0, grid = 1-12)
    // ─────────────────────────────────────────
    function buildAprilGrid() {
      // Hero click
      document.getElementById('april-hero-img').addEventListener('click', function() {
        openLb(0, APRIL_PHOTOS, 'April/photos_april_web/');
      });

      // Grid photos (skip index 0)
      var grid = document.getElementById('april-grid');
      APRIL_PHOTOS.slice(1).forEach(function(file, i) {
        var photoIndex = i + 1;

        var wrap = document.createElement('div');
        wrap.className = 'april-grid-item';

        var img = document.createElement('img');
        img.src = 'April/photos_april_web/' + file;
        img.alt = 'Oleh Riabchenko — April series, photograph ' + (photoIndex + 1);
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onerror = function() { wrap.style.display = 'none'; };

        wrap.addEventListener('click', (function(idx) {
          return function() { openLb(idx, APRIL_PHOTOS, 'April/photos_april_web/'); };
        })(photoIndex));

        wrap.appendChild(img);
        grid.appendChild(wrap);
      });
    }

    // ─────────────────────────────────────────
    // Init
    // ─────────────────────────────────────────
    (function init() {
      buildGrid();
      buildAprilGrid();
      setLang('en');

      // Auto-detect country
      fetch('https://ipapi.co/json/')
        .then(function(r) { return r.json(); })
        .then(function(d) { if (d.country_code === 'UA') setLang('uk'); })
        .catch(function() {});
    })();
  </script>
